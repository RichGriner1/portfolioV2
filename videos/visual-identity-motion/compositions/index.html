<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1080" />
    <title>Afi Visual Identity — bento resolve</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: #ffffff;
      }

      /* Composition root — square corners, no inset. The site rounds the tile
         in CSS; mp4 has no alpha, so any baked rounding here would render as
         black wedges. No background on the root itself (compositor caveat —
         the full-bleed fill lives on the clip child instead). */
      #stage {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
      }

      /* Single full-duration clip = the whole scene. Full-bleed fill lives
         here (a child of the root), not on the root itself. overflow:hidden
         also clips the instrument line while it travels off-canvas. */
      #scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #ffffff;
        overflow: hidden;
      }

      /* Content box: 720x720, centered, 180px margin all sides. CSS Grid
         gives every cell its exact "resolved" (true grid position) geometry
         for free — GSAP only ever has to animate a translate OFFSET away
         from that true position, never the position itself. */
      #grid {
        position: absolute;
        left: 180px;
        top: 180px;
        width: 720px;
        height: 720px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 20px;
      }

      .cell {
        /* border-box so animating border-width never shifts the outer box —
           purely a visual change, no layout channel is touched. */
        box-sizing: border-box;
        border-style: solid;
        border-radius: 4px; /* constant in both states — radius never animates */
        /* No CSS `transform` here — GSAP owns x/y fully via fromTo tweens.
           (Pairing a CSS initial transform with a GSAP tween on the same
           property is the gsap_css_transform_conflict lint failure.) */
      }

      #cell-a {
        grid-column: 1 / 3;
        grid-row: 1 / 3;
      }
      #cell-b {
        grid-column: 3 / 4;
        grid-row: 1 / 2;
      }
      #cell-c {
        grid-column: 3 / 4;
        grid-row: 2 / 3;
      }
      #cell-d {
        grid-column: 1 / 2;
        grid-row: 3 / 4;
      }
      #cell-e {
        grid-column: 2 / 3;
        grid-row: 3 / 4;
      }
      #cell-f {
        grid-column: 3 / 4;
        grid-row: 3 / 4;
      }

      /* Instrument: a plain hairline with two perpendicular tick marks at
         its ends — a drafting dimension-line terminator, not a scan line.
         No CSS transform (GSAP owns x/y/rotation). Rotation is a *constant*
         45deg carried in every tween's from/to (never itself animated), so
         the bar always points along the content box's main diagonal while
         GSAP's x/y sweep its center from off-canvas top-left to off-canvas
         bottom-right. */
      #instrument {
        position: absolute;
        top: 0;
        left: 0;
        width: 340px;
        height: 1.5px;
        background: #242424;
      }

      .tick {
        position: absolute;
        width: 1.5px;
        height: 14px;
        background: #242424;
        top: -6.25px;
      }
      .tick-start {
        left: -0.75px;
      }
      .tick-end {
        left: 339.25px;
      }
    </style>
  </head>
  <body>
    <div
      id="stage"
      data-composition-id="visual-identity-motion"
      data-start="0"
      data-width="1080"
      data-height="1080"
      data-duration="6"
      data-fps="30"
    >
      <div id="scene" class="clip" data-start="0" data-duration="6" data-track-index="0">
        <div id="grid">
          <div id="cell-a" class="cell"></div>
          <div id="cell-b" class="cell"></div>
          <div id="cell-c" class="cell"></div>
          <div id="cell-d" class="cell"></div>
          <div id="cell-e" class="cell"></div>
          <div id="cell-f" class="cell"></div>
        </div>

        <!--
          Intentional bleed: the instrument travels well outside the canvas
          by design (off-canvas at both loop bookends) and is clipped by
          #scene's overflow:hidden. Scoped to this one decorative element
          only — nothing else in the composition overflows.
        -->
        <div id="instrument" data-layout-allow-overflow="true">
          <div class="tick tick-start"></div>
          <div class="tick tick-end"></div>
        </div>
      </div>
    </div>

    <script>
      // ---- cubic-bezier(0.45, 0.05, 0.15, 1) === --ease-in-out-soft -------
      // Pure function of progress (no state, no clock) — seek-safe by
      // construction, same discipline as the springEase helper pattern.
      // Standard Newton-Raphson bezier solver with a bisection fallback.
      function cubicBezierEase(x1, y1, x2, y2) {
        function A(a1, a2) {
          return 1.0 - 3.0 * a2 + 3.0 * a1;
        }
        function B(a1, a2) {
          return 3.0 * a2 - 6.0 * a1;
        }
        function C(a1) {
          return 3.0 * a1;
        }
        function calcBezier(t, a1, a2) {
          return ((A(a1, a2) * t + B(a1, a2)) * t + C(a1)) * t;
        }
        function getSlope(t, a1, a2) {
          return 3.0 * A(a1, a2) * t * t + 2.0 * B(a1, a2) * t + C(a1);
        }
        function getTForX(x) {
          let t = x;
          for (let i = 0; i < 8; i++) {
            const slope = getSlope(t, x1, x2);
            if (slope === 0) break;
            const currentX = calcBezier(t, x1, x2) - x;
            t -= currentX / slope;
          }
          if (t < 0 || t > 1) {
            let lo = 0,
              hi = 1,
              guess = x;
            for (let i = 0; i < 20; i++) {
              const currentX = calcBezier(guess, x1, x2);
              if (Math.abs(currentX - x) < 1e-7) break;
              if (currentX < x) lo = guess;
              else hi = guess;
              guess = (lo + hi) / 2;
            }
            return guess;
          }
          return t;
        }
        return function (x) {
          if (x <= 0) return 0;
          if (x >= 1) return 1;
          return calcBezier(getTForX(x), y1, y2);
        };
      }

      const easeInOutSoft = cubicBezierEase(0.45, 0.05, 0.15, 1);

      // ---- per-cell static ("no system") state — hand-set, never random,
      // transcribed verbatim from the brief's table. --------------------
      const STATIC = {
        A: { x: 0, y: 0, borderWidth: 1.5 },
        B: { x: 6, y: -4, borderWidth: 1 },
        C: { x: -4, y: 6, borderWidth: 2 },
        D: { x: 5, y: 3, borderWidth: 1 },
        E: { x: -6, y: -3, borderWidth: 2.5 },
        F: { x: 3, y: 5, borderWidth: 1 },
      };
      const RESOLVED = { x: 0, y: 0, borderWidth: 1.5 };
      const STATIC_STROKE = "#8e8e8e"; // --muted-foreground
      const RESOLVED_STROKE = "#242424"; // --foreground
      const STATIC_FILL = "rgba(247, 247, 247, 0)"; // --muted, alpha 0 = "none"
      const RESOLVED_FILL = "rgba(247, 247, 247, 1)"; // --muted

      // Build-pass windows — transcribed verbatim from shot-plan.json
      // content.timing.build_pass_per_cell_windows (absolute seconds).
      const BUILD_WINDOWS = {
        A: [0.5, 0.85],
        B: [0.75, 1.1],
        D: [0.95, 1.3],
        C: [1.25, 1.6],
        E: [1.55, 1.9],
        F: [1.95, 2.3],
      };

      // Settle-pass windows — the brief gives this as "mirrors the build-pass
      // order, scaled proportionally into the 1.8s settle window (3.8-5.6s)"
      // without exact numbers. Derived here by scaling each build-pass
      // start offset (relative to the 0.4s build-pass start) by
      // 1.8 / 1.9 (the settle window's duration over the build-pass's own
      // start-to-end span) and using the brief's ~0.30s local-revert length —
      // same order, same proportional spacing, fits exactly inside 3.8-5.6s.
      const SETTLE_WINDOWS = {
        A: [3.9, 4.23],
        B: [4.13, 4.46],
        D: [4.32, 4.65],
        C: [4.6, 4.93],
        E: [4.89, 5.22],
        F: [5.27, 5.6],
      };

      const ORDER = ["A", "B", "D", "C", "E", "F"];

      const tl = gsap.timeline({ paused: true });

      ORDER.forEach((id) => {
        const el = document.getElementById("cell-" + id.toLowerCase());
        const s = STATIC[id];
        const buildW = BUILD_WINDOWS[id];
        const settleW = SETTLE_WINDOWS[id];

        // Rest hold (t=0 -> this cell's build start): an explicit fromTo
        // with identical from/to establishes the true CSS-free static
        // appearance before any real motion starts (GSAP owns transform
        // fully, so nothing renders this state until a tween says so).
        tl.fromTo(
          el,
          { x: s.x, y: s.y, borderWidth: s.borderWidth, borderColor: STATIC_STROKE, backgroundColor: STATIC_FILL },
          {
            x: s.x,
            y: s.y,
            borderWidth: s.borderWidth,
            borderColor: STATIC_STROKE,
            backgroundColor: STATIC_FILL,
            duration: buildW[0],
            ease: easeInOutSoft,
          },
          0,
        );

        // Build: static -> resolved. Local tween, overlaps slightly into
        // the next cell's window per the brief so the six resolves read as
        // one continuous wave rather than six discrete clicks.
        tl.fromTo(
          el,
          { x: s.x, y: s.y, borderWidth: s.borderWidth, borderColor: STATIC_STROKE, backgroundColor: STATIC_FILL },
          {
            x: RESOLVED.x,
            y: RESOLVED.y,
            borderWidth: RESOLVED.borderWidth,
            borderColor: RESOLVED_STROKE,
            backgroundColor: RESOLVED_FILL,
            duration: buildW[1] - buildW[0],
            ease: easeInOutSoft,
          },
          buildW[0],
        );

        // Settle: resolved -> static, same order as build (A->B->D->C->E->F),
        // never reversed — this is what keeps it reading as "rebuilt for the
        // next pass," not a rewind.
        tl.fromTo(
          el,
          {
            x: RESOLVED.x,
            y: RESOLVED.y,
            borderWidth: RESOLVED.borderWidth,
            borderColor: RESOLVED_STROKE,
            backgroundColor: RESOLVED_FILL,
          },
          {
            x: s.x,
            y: s.y,
            borderWidth: s.borderWidth,
            borderColor: STATIC_STROKE,
            backgroundColor: STATIC_FILL,
            duration: settleW[1] - settleW[0],
            ease: easeInOutSoft,
          },
          settleW[0],
        );
      });

      // ---- instrument: one diagonal hairline sweeping the content box's
      // diagonal, off-canvas at both loop bookends. ------------------------
      const LINE_W = 340;
      const LINE_H = 1.5;
      const ROTATION = 45; // constant — never itself animated

      // Off-canvas travel centers. --ease-in-out-soft saturates hard near
      // the tail (progress 0.9 -> 1.0 covers <1% of remaining travel), so a
      // generous END overshoot makes the line vanish well before the
      // build-pass window actually closes, orphaning cell F's late resolve
      // (1.95-2.30s) with no line on screen. END is tuned to the minimum
      // safe off-canvas distance (~14px clearance past the rotated
      // bounding box's half-extent, ~121px) so the exit lands close to
      // 2.4s instead of ~1.8s, keeping the line visible into F's window.
      // START keeps a larger margin — the entry side has no equivalent
      // late-cell problem to correct for.
      const CENTER_START = { x: -200, y: -200 }; // beyond content box's top-left corner
      const CENTER_END = { x: 1215, y: 1215 }; // beyond content box's bottom-right corner

      function lineXY(center) {
        return { x: center.x - LINE_W / 2, y: center.y - LINE_H / 2 };
      }
      const START = lineXY(CENTER_START);
      const END = lineXY(CENTER_END);

      const line = document.getElementById("instrument");

      // Rest hold (t=0 -> 0.4): fully off-canvas, invisible — the loop's
      // opening bookend.
      tl.fromTo(
        line,
        { x: START.x, y: START.y, rotation: ROTATION },
        { x: START.x, y: START.y, rotation: ROTATION, duration: 0.4, ease: easeInOutSoft },
        0,
      );

      // Build pass (0.4 -> 2.4): sweeps from off-canvas top-left to
      // off-canvas bottom-right.
      tl.fromTo(
        line,
        { x: START.x, y: START.y, rotation: ROTATION },
        { x: END.x, y: END.y, rotation: ROTATION, duration: 2.0, ease: easeInOutSoft },
        0.4,
      );

      // Peak hold (2.4 -> ~3.8): nothing tweens, line stays at its
      // build-pass end position — fully off-canvas, invisible.

      // Reset (silent — both endpoints are off-canvas, so this jump is
      // never visible): re-park the line at the top-left start position so
      // the settle pass can re-enter from the same corner, same direction,
      // never reversed. A short fromTo, not a bare tl.set, per the brief.
      tl.fromTo(
        line,
        { x: END.x, y: END.y, rotation: ROTATION },
        { x: START.x, y: START.y, rotation: ROTATION, duration: 0.05, ease: easeInOutSoft },
        3.75,
      );

      // Settle pass (3.8 -> 5.6): re-enters at the same top-left corner,
      // travels the same diagonal, same direction — never reversed.
      tl.fromTo(
        line,
        { x: START.x, y: START.y, rotation: ROTATION },
        { x: END.x, y: END.y, rotation: ROTATION, duration: 1.8, ease: easeInOutSoft },
        3.8,
      );

      // Tail hold (5.6 -> 6.0): line stays at its settle-pass end position,
      // fully off-canvas — the loop's closing bookend. Off-canvas at both
      // t=0 (top-left side) and t=6 (bottom-right side) renders identical
      // (empty) pixels for the instrument, since overflow:hidden clips both.

      window.__timelines = window.__timelines || {};
      window.__timelines["visual-identity-motion"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" role="img" aria-label="Two section-level variants side by side: page with H2 and three H3 subsections, versus page with a single section and no H2">
  <style>
    svg { color: #18181b; }
    @media (prefers-color-scheme: dark) { svg { color: #f5f5f5; } }
  </style>
  <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <!-- Frame A: H1 + H2 + three H3 subsections -->
    <g transform="translate(8 8)">
      <rect x="0.75" y="0.75" width="478.5" height="302.5" rx="10" opacity="0.3"/>
      <text x="18" y="22" font-family="ui-monospace, monospace" font-size="9" fill="currentColor" opacity="0.55">Multi-section · H2 earns its slot</text>
      <line x1="18" y1="28" x2="172" y2="28" opacity="0.25"/>

      <!-- H1 (page header) -->
      <rect x="18" y="42" width="180" height="18" rx="3" fill="currentColor" stroke="none" opacity="0.9"/>
      <text x="18" y="73" font-family="ui-monospace, monospace" font-size="7" fill="currentColor" opacity="0.5">H1 · page header</text>

      <!-- H2 -->
      <rect x="18" y="92" width="140" height="14" rx="3" fill="currentColor" stroke="none" opacity="0.78"/>
      <text x="18" y="119" font-family="ui-monospace, monospace" font-size="7" fill="currentColor" opacity="0.5">H2 · Situación actual</text>

      <!-- H3 #1 + content -->
      <rect x="34" y="134" width="86" height="10" rx="2" fill="currentColor" stroke="none" opacity="0.6"/>
      <line x1="34" y1="156" x2="466" y2="156" opacity="0.18"/>
      <line x1="34" y1="166" x2="430" y2="166" opacity="0.18"/>
      <line x1="34" y1="176" x2="448" y2="176" opacity="0.18"/>

      <!-- H3 #2 + content -->
      <rect x="34" y="196" width="110" height="10" rx="2" fill="currentColor" stroke="none" opacity="0.6"/>
      <line x1="34" y1="218" x2="466" y2="218" opacity="0.18"/>
      <line x1="34" y1="228" x2="412" y2="228" opacity="0.18"/>
      <line x1="34" y1="238" x2="450" y2="238" opacity="0.18"/>

      <!-- H3 #3 + content -->
      <rect x="34" y="258" width="98" height="10" rx="2" fill="currentColor" stroke="none" opacity="0.6"/>
      <line x1="34" y1="280" x2="466" y2="280" opacity="0.18"/>
      <line x1="34" y1="290" x2="424" y2="290" opacity="0.18"/>
    </g>

    <!-- divider between variants -->
    <line x1="496" y1="40" x2="496" y2="278" opacity="0.25" stroke-dasharray="2 4"/>

    <!-- Frame B: H1 + single content, no H2 -->
    <g transform="translate(512 8)">
      <rect x="0.75" y="0.75" width="478.5" height="302.5" rx="10" opacity="0.3"/>
      <text x="18" y="22" font-family="ui-monospace, monospace" font-size="9" fill="currentColor" opacity="0.55">Single section · H2 omitted</text>
      <line x1="18" y1="28" x2="172" y2="28" opacity="0.25"/>

      <!-- H1 (page header) -->
      <rect x="18" y="42" width="180" height="18" rx="3" fill="currentColor" stroke="none" opacity="0.9"/>
      <text x="18" y="73" font-family="ui-monospace, monospace" font-size="7" fill="currentColor" opacity="0.5">H1 · page header (is the section)</text>

      <!-- table, no H2 -->
      <rect x="18" y="92" width="448" height="190" rx="4" opacity="0.35"/>
      <line x1="18" y1="110" x2="466" y2="110" opacity="0.3"/>
      <line x1="78.5" y1="92" x2="78.5" y2="282" opacity="0.2"/>
      <line x1="171.5" y1="92" x2="171.5" y2="282" opacity="0.2"/>
      <line x1="264.5" y1="92" x2="264.5" y2="282" opacity="0.2"/>
      <line x1="357.5" y1="92" x2="357.5" y2="282" opacity="0.2"/>
      <line x1="18" y1="134" x2="466" y2="134" opacity="0.15"/>
      <line x1="18" y1="158" x2="466" y2="158" opacity="0.15"/>
      <line x1="18" y1="182" x2="466" y2="182" opacity="0.15"/>
      <line x1="18" y1="206" x2="466" y2="206" opacity="0.15"/>
      <line x1="18" y1="230" x2="466" y2="230" opacity="0.15"/>
      <line x1="18" y1="254" x2="466" y2="254" opacity="0.15"/>
    </g>
  </g>
</svg>

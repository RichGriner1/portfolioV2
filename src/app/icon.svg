<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="8.0625 8.8438 44 44" fill="none">
  <!-- RG monogram. The path data is the Figma export (Favicon1.svg) untouched. The
       viewBox is tightened from the 60x60 artboard to the glyph's ink box plus an
       even 6% margin: on the original artboard the mark filled only 39% of the
       height, so it turned to mush at 16px.

       The fill flips with the OS colour scheme so the near-black mark does not
       vanish against a dark tab strip. #232323 is the brand near-black; #fafafa is
       the dark theme's foreground token, oklch(0.985 0 0). The presentation
       attribute on the path keeps #232323 as the fallback wherever a renderer
       ignores the stylesheet, which is also how favicon.ico is rasterised.

       Keep this comment free of doubled hyphens; they are illegal inside an XML
       comment and make the whole file undecodable as an image. -->
  <style>
    .mark { fill: #232323 }
    @media (prefers-color-scheme: dark) { .mark { fill: #fafafa } }
  </style>

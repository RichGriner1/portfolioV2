<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-label="Two shots showing filters scoped to the active tab: switching tabs swaps the filter pill row beneath">
  <style>
    svg { color: #18181b; }
    @media (prefers-color-scheme: dark) { svg { color: #f5f5f5; } }
  </style>
  <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <!-- Frame A: tab "Resumen" active, its own filter row -->
    <g transform="translate(8 8)">
      <rect x="0.75" y="0.75" width="478.5" height="262.5" rx="10" opacity="0.3"/>
      <text x="18" y="22" font-family="ui-monospace, monospace" font-size="9" fill="currentColor" opacity="0.55">Tab A active · filters scope here</text>
      <line x1="18" y1="28" x2="172" y2="28" opacity="0.25"/>

      <!-- tab row -->
      <line x1="18" y1="60" x2="466" y2="60" opacity="0.25"/>
      <rect x="18" y="48" width="62" height="16" rx="3" fill="currentColor" stroke="none" opacity="0.9"/>
      <line x1="92" y1="57" x2="132" y2="57" opacity="0.45"/>
      <line x1="146" y1="57" x2="192" y2="57" opacity="0.45"/>
      <line x1="206" y1="57" x2="244" y2="57" opacity="0.45"/>

      <!-- active tab underline -->
      <line x1="18" y1="60.5" x2="80" y2="60.5" stroke-width="2" opacity="1"/>

      <!-- filter pill row A -->
      <rect x="18" y="76" width="64" height="20" rx="10" opacity="0.7"/>
      <rect x="90" y="76" width="84" height="20" rx="10" opacity="0.7"/>
      <rect x="182" y="76" width="58" height="20" rx="10" opacity="0.7"/>
      <rect x="248" y="76" width="72" height="20" rx="10" opacity="0.7"/>

      <!-- content body -->
      <rect x="18" y="110" width="448" height="148" rx="4" opacity="0.32"/>
      <line x1="18" y1="128" x2="466" y2="128" opacity="0.22"/>
      <line x1="120" y1="110" x2="120" y2="258" opacity="0.18"/>
      <line x1="222" y1="110" x2="222" y2="258" opacity="0.18"/>
      <line x1="324" y1="110" x2="324" y2="258" opacity="0.18"/>
      <line x1="18" y1="150" x2="466" y2="150" opacity="0.14"/>
      <line x1="18" y1="172" x2="466" y2="172" opacity="0.14"/>
      <line x1="18" y1="194" x2="466" y2="194" opacity="0.14"/>
      <line x1="18" y1="216" x2="466" y2="216" opacity="0.14"/>
      <line x1="18" y1="238" x2="466" y2="238" opacity="0.14"/>
    </g>

    <line x1="496" y1="138" x2="496" y2="170" opacity="0.4"/>
    <polyline points="492,164 496,170 500,164" opacity="0.4"/>

    <!-- Frame B: tab B active, different filter row -->
    <g transform="translate(512 8)">
      <rect x="0.75" y="0.75" width="478.5" height="262.5" rx="10" opacity="0.3"/>
      <text x="18" y="22" font-family="ui-monospace, monospace" font-size="9" fill="currentColor" opacity="0.55">Tab B active · filters change with it</text>
      <line x1="18" y1="28" x2="172" y2="28" opacity="0.25"/>

      <!-- tab row -->
      <line x1="18" y1="60" x2="466" y2="60" opacity="0.25"/>
      <line x1="18" y1="57" x2="64" y2="57" opacity="0.45"/>
      <rect x="78" y="48" width="78" height="16" rx="3" fill="currentColor" stroke="none" opacity="0.9"/>
      <line x1="170" y1="57" x2="210" y2="57" opacity="0.45"/>
      <line x1="224" y1="57" x2="262" y2="57" opacity="0.45"/>

      <!-- active tab underline -->
      <line x1="78" y1="60.5" x2="156" y2="60.5" stroke-width="2" opacity="1"/>

      <!-- filter pill row B — different set, different lengths -->
      <rect x="18" y="76" width="92" height="20" rx="10" opacity="0.7"/>
      <rect x="118" y="76" width="46" height="20" rx="10" opacity="0.7"/>
      <rect x="172" y="76" width="68" height="20" rx="10" opacity="0.7"/>

      <!-- content body — different shape (chart) -->
      <rect x="18" y="110" width="448" height="148" rx="4" opacity="0.32"/>
      <line x1="40" y1="130" x2="40" y2="240" opacity="0.3"/>
      <line x1="40" y1="240" x2="448" y2="240" opacity="0.3"/>
      <!-- bars -->
      <rect x="60" y="170" width="32" height="70" fill="currentColor" stroke="none" opacity="0.65"/>
      <rect x="108" y="150" width="32" height="90" fill="currentColor" stroke="none" opacity="0.65"/>
      <rect x="156" y="190" width="32" height="50" fill="currentColor" stroke="none" opacity="0.65"/>
      <rect x="204" y="160" width="32" height="80" fill="currentColor" stroke="none" opacity="0.65"/>
      <rect x="252" y="140" width="32" height="100" fill="currentColor" stroke="none" opacity="0.65"/>
      <rect x="300" y="175" width="32" height="65" fill="currentColor" stroke="none" opacity="0.65"/>
      <rect x="348" y="195" width="32" height="45" fill="currentColor" stroke="none" opacity="0.65"/>
      <rect x="396" y="180" width="32" height="60" fill="currentColor" stroke="none" opacity="0.65"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" role="img" aria-label="Three shots of the page level: identical page header and tabs, content slot morphs through wide table, line chart, and 2-point graph">
  <style>
    svg { color: #18181b; }
    @media (prefers-color-scheme: dark) { svg { color: #f5f5f5; } }
  </style>
  <g fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
    <!-- Frame 1: wide table (10 columns) -->
    <g transform="translate(8 8)">
      <rect x="0.75" y="0.75" width="298.5" height="262.5" rx="10" opacity="0.3"/>
      <!-- faint global shell band -->
      <rect x="10" y="10" width="288" height="18" rx="4" opacity="0.18"/>
      <circle cx="20" cy="19" r="2.5" fill="currentColor" stroke="none" opacity="0.4"/>
      <line x1="28" y1="19" x2="44" y2="19" opacity="0.3"/>
      <line x1="50" y1="19" x2="62" y2="19" opacity="0.3"/>
      <!-- page header -->
      <rect x="18" y="40" width="130" height="14" rx="3" fill="currentColor" stroke="none" opacity="0.85"/>
      <rect x="232" y="38" width="32" height="18" rx="4" opacity="0.6"/>
      <rect x="268" y="38" width="22" height="18" rx="4" fill="currentColor" stroke="none" opacity="0.85"/>
      <!-- tab row -->
      <line x1="18" y1="74" x2="290" y2="74" opacity="0.25"/>
      <rect x="18" y="64" width="46" height="14" rx="3" fill="currentColor" stroke="none" opacity="0.9"/>
      <line x1="74" y1="71" x2="100" y2="71" opacity="0.45"/>
      <line x1="110" y1="71" x2="138" y2="71" opacity="0.45"/>
      <line x1="148" y1="71" x2="172" y2="71" opacity="0.45"/>
      <!-- slot label -->
      <text x="18" y="92" font-family="ui-monospace, monospace" font-size="7" fill="currentColor" opacity="0.5">wide table · 10 cols</text>
      <!-- content slot: wide table -->
      <rect x="18" y="100" width="272" height="148" rx="4" opacity="0.35"/>
      <!-- header row -->
      <line x1="18" y1="114" x2="290" y2="114" opacity="0.25"/>
      <!-- 10 column dividers -->
      <line x1="45.2" y1="100" x2="45.2" y2="248" opacity="0.18"/>
      <line x1="72.4" y1="100" x2="72.4" y2="248" opacity="0.18"/>
      <line x1="99.6" y1="100" x2="99.6" y2="248" opacity="0.18"/>
      <line x1="126.8" y1="100" x2="126.8" y2="248" opacity="0.18"/>
      <line x1="154" y1="100" x2="154" y2="248" opacity="0.18"/>
      <line x1="181.2" y1="100" x2="181.2" y2="248" opacity="0.18"/>
      <line x1="208.4" y1="100" x2="208.4" y2="248" opacity="0.18"/>
      <line x1="235.6" y1="100" x2="235.6" y2="248" opacity="0.18"/>
      <line x1="262.8" y1="100" x2="262.8" y2="248" opacity="0.18"/>
      <!-- row dividers -->
      <line x1="18" y1="134" x2="290" y2="134" opacity="0.15"/>
      <line x1="18" y1="154" x2="290" y2="154" opacity="0.15"/>
      <line x1="18" y1="174" x2="290" y2="174" opacity="0.15"/>
      <line x1="18" y1="194" x2="290" y2="194" opacity="0.15"/>
      <line x1="18" y1="214" x2="290" y2="214" opacity="0.15"/>
      <line x1="18" y1="234" x2="290" y2="234" opacity="0.15"/>
    </g>

    <line x1="320" y1="148" x2="346" y2="148" opacity="0.4" stroke-dasharray="3 4"/>
    <polyline points="340,144 346,148 340,152" opacity="0.4"/>

    <!-- Frame 2: line chart -->
    <g transform="translate(354 8)">
      <rect x="0.75" y="0.75" width="298.5" height="262.5" rx="10" opacity="0.3"/>
      <rect x="10" y="10" width="288" height="18" rx="4" opacity="0.18"/>
      <circle cx="20" cy="19" r="2.5" fill="currentColor" stroke="none" opacity="0.4"/>
      <line x1="28" y1="19" x2="44" y2="19" opacity="0.3"/>
      <line x1="50" y1="19" x2="62" y2="19" opacity="0.3"/>
      <rect x="18" y="40" width="130" height="14" rx="3" fill="currentColor" stroke="none" opacity="0.85"/>
      <rect x="232" y="38" width="32" height="18" rx="4" opacity="0.6"/>
      <rect x="268" y="38" width="22" height="18" rx="4" fill="currentColor" stroke="none" opacity="0.85"/>
      <line x1="18" y1="74" x2="290" y2="74" opacity="0.25"/>
      <rect x="18" y="64" width="46" height="14" rx="3" fill="currentColor" stroke="none" opacity="0.9"/>
      <line x1="74" y1="71" x2="100" y2="71" opacity="0.45"/>
      <line x1="110" y1="71" x2="138" y2="71" opacity="0.45"/>
      <line x1="148" y1="71" x2="172" y2="71" opacity="0.45"/>
      <text x="18" y="92" font-family="ui-monospace, monospace" font-size="7" fill="currentColor" opacity="0.5">line chart · multi-series</text>
      <rect x="18" y="100" width="272" height="148" rx="4" opacity="0.35"/>
      <!-- y axis ticks -->
      <line x1="18" y1="120" x2="22" y2="120" opacity="0.3"/>
      <line x1="18" y1="160" x2="22" y2="160" opacity="0.3"/>
      <line x1="18" y1="200" x2="22" y2="200" opacity="0.3"/>
      <line x1="18" y1="240" x2="22" y2="240" opacity="0.3"/>
      <!-- gridlines -->
      <line x1="22" y1="160" x2="290" y2="160" opacity="0.12" stroke-dasharray="2 3"/>
      <line x1="22" y1="200" x2="290" y2="200" opacity="0.12" stroke-dasharray="2 3"/>
      <!-- series A -->
      <polyline points="26,220 56,200 86,210 116,180 146,170 176,155 206,165 236,140 266,150 286,125" fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.85"/>
      <!-- series B (muted) -->
      <polyline points="26,235 56,228 86,224 116,222 146,214 176,210 206,202 236,196 266,188 286,182" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.45"/>
    </g>

    <line x1="666" y1="148" x2="692" y2="148" opacity="0.4" stroke-dasharray="3 4"/>
    <polyline points="686,144 692,148 686,152" opacity="0.4"/>

    <!-- Frame 3: 2-point graph -->
    <g transform="translate(700 8)">
      <rect x="0.75" y="0.75" width="291.5" height="262.5" rx="10" opacity="0.3"/>
      <rect x="10" y="10" width="281" height="18" rx="4" opacity="0.18"/>
      <circle cx="20" cy="19" r="2.5" fill="currentColor" stroke="none" opacity="0.4"/>
      <line x1="28" y1="19" x2="44" y2="19" opacity="0.3"/>
      <line x1="50" y1="19" x2="62" y2="19" opacity="0.3"/>
      <rect x="18" y="40" width="130" height="14" rx="3" fill="currentColor" stroke="none" opacity="0.85"/>
      <rect x="225" y="38" width="32" height="18" rx="4" opacity="0.6"/>
      <rect x="261" y="38" width="22" height="18" rx="4" fill="currentColor" stroke="none" opacity="0.85"/>
      <line x1="18" y1="74" x2="283" y2="74" opacity="0.25"/>
      <rect x="18" y="64" width="46" height="14" rx="3" fill="currentColor" stroke="none" opacity="0.9"/>
      <line x1="74" y1="71" x2="100" y2="71" opacity="0.45"/>
      <line x1="110" y1="71" x2="138" y2="71" opacity="0.45"/>
      <line x1="148" y1="71" x2="172" y2="71" opacity="0.45"/>
      <text x="18" y="92" font-family="ui-monospace, monospace" font-size="7" fill="currentColor" opacity="0.5">2 points · projection</text>
      <rect x="18" y="100" width="265" height="148" rx="4" opacity="0.35"/>
      <!-- axes -->
      <line x1="40" y1="120" x2="40" y2="232" opacity="0.3"/>
      <line x1="40" y1="232" x2="270" y2="232" opacity="0.3"/>
      <!-- two big points + connecting line -->
      <line x1="80" y1="200" x2="240" y2="140" stroke-width="1.6" opacity="0.85"/>
      <circle cx="80" cy="200" r="5" fill="currentColor" stroke="none" opacity="0.9"/>
      <circle cx="240" cy="140" r="5" fill="currentColor" stroke="none" opacity="0.9"/>
      <line x1="80" y1="200" x2="80" y2="232" opacity="0.25" stroke-dasharray="2 3"/>
      <line x1="240" y1="140" x2="240" y2="232" opacity="0.25" stroke-dasharray="2 3"/>
    </g>
  </g>
</svg>

<html lang="es" data-ds-v2 data-foundation="modern" data-variant="afi" data-skin="afi" data-brand="afi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<title>Portfolio · SAREVI, controles</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/afi-modern/tokens/dimensions.css">
<link rel="stylesheet" href="ds/afi-modern/tokens/colors.css">
<link rel="stylesheet" href="ds/afi-modern/tokens/semantic-colors.css">
<link rel="stylesheet" href="ds/afi-modern/tokens/semantic-dimensions.css">
<link rel="stylesheet" href="ds/afi-modern/tokens/spacing.css">
<link rel="stylesheet" href="ds/afi-modern/tokens/typography.css">
<link rel="stylesheet" href="ds/afi-modern/tokens/elevation.css">
<link rel="stylesheet" href="ds/afi-modern/tokens/motion.css">
<link rel="stylesheet" href="ds/afi-modern/tokens/component-button.css">
<link rel="stylesheet" href="ds/afi-modern/tokens/component-toast.css">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&display=swap">
<style>
html, html[data-ds-v2], body, #root { background: transparent !important; }
body { margin: 0; font-family: var(--font-family-primary); color: var(--content-primary); }
#root { box-sizing: border-box; width: 880px; min-height: 100vh; margin: 0 auto; padding: var(--dimension-4) var(--dimension-8); display: flex; align-items: center; }
.pf { display: grid; grid-template-columns: 1.35fr 1fr; gap: var(--dimension-8); width: 100%; align-items: start; }
.pf-col { display: flex; flex-direction: column; gap: var(--dimension-5); }
.pf-label { margin: 0; font-size: var(--type-label-size); font-weight: var(--font-weight-semibold); }
.pf-card { display: flex; flex-direction: column; gap: var(--dimension-3); padding: var(--dimension-5); background: var(--background-surface); border-radius: var(--radius-xl); box-shadow: var(--elevation-2); }
.pf-switch { display: flex; align-items: center; justify-content: space-between; gap: var(--dimension-3); padding: var(--dimension-4) var(--dimension-5); background: var(--background-surface); border-radius: var(--radius-xl); box-shadow: var(--elevation-2); }
.pf-switch p { margin: 0; }
.pf-switch__t { font-weight: var(--font-weight-semibold); font-size: var(--type-body-default-size); }
.pf-switch__d { font-size: var(--type-caption-size); color: var(--content-secondary); }
.pf-casas { display: flex; flex-direction: column; gap: var(--dimension-4); width: 100%; }
</style>
</head>
<body data-board="controles">
<div id="root"></div>
<script src="ds/afi-modern/components/bundle.js"></script>
<script src="pf-boards.js"></script>
</body>
</html>
